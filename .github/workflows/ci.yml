name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: PHP ${{ matrix.php }} / MW WP Form ${{ matrix.mwf }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.3' ]
        mwf: [ '5.1.8', 'sim52' ]
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Lint (PHPCS)
        run: npm run lint

      - name: Prepare MW WP Form fixture
        run: bin/mwf-fixture.sh ${{ matrix.mwf }}

      - name: Start wp-env
        run: |
          npx wp-env start
          npm run env:activate

      - name: PHPUnit
        run: npm run test:php

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-php${{ matrix.php }}-${{ matrix.mwf }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
